<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor de Categorias Analíticas</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e2e;
      --surface: #2a2a3e;
      --surface2: #313149;
      --border: #44446a;
      --text: #cdd6f4;
      --text-dim: #7f849c;
      --accent: #89b4fa;
      --green: #a6e3a1;
      --red: #f38ba8;
      --yellow: #f9e2af;
      --mauve: #cba6f7;
      --teal: #94e2d5;
      --peach: #fab387;
      --pink: #f5c2e7;
      --sky: #89dceb;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
      --font-ui: system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Top Bar ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      white-space: nowrap;
    }

    .header-sep { flex: 1; }

    .btn {
      padding: 5px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--border); }
    .btn.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn.primary:hover { opacity: 0.85; }
    .btn.danger { border-color: var(--red); color: var(--red); }
    .btn.danger:hover { background: rgba(243,139,168,0.15); }

    /* ── Main Layout ── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar: Categories ── */
    aside {
      width: 220px;
      min-width: 180px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 14px 14px 8px;
    }

    .cat-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
    }

    .cat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.12s;
      font-size: 13px;
      user-select: none;
    }
    .cat-item:hover { background: var(--surface2); }
    .cat-item.active { background: var(--surface2); outline: 1px solid var(--border); }

    .cat-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .cat-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .cat-count {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--bg);
      border-radius: 10px;
      padding: 1px 6px;
    }

    .cat-del {
      opacity: 0;
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
      transition: opacity 0.1s;
    }
    .cat-item:hover .cat-del { opacity: 1; }

    /* New category form */
    .new-cat {
      padding: 10px 8px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .new-cat input {
      padding: 6px 9px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .new-cat input:focus { border-color: var(--accent); }

    .color-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      padding: 2px 0;
    }

    .color-swatch {
      width: 18px; height: 18px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: border-color 0.1s, transform 0.1s;
    }
    .color-swatch:hover { transform: scale(1.2); }
    .color-swatch.selected { border-color: #fff; }

    /* ── Editor Area ── */
    .editor-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .toolbar-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    /* ── Annotated Editor ── */
    .editor-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    #editor-container {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Each "block" = a line with its annotation row above it */
    .block {
      display: flex;
      flex-direction: column;
    }

    /* Badge row above the line */
    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 4px 52px 2px;
      min-height: 0;
    }
    .badge-row:empty { padding: 0 52px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px 2px 6px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #111;
      cursor: default;
      user-select: none;
      animation: badgePop 0.15s ease;
    }
    @keyframes badgePop {
      from { transform: scale(0.7); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .badge-x {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0;
      color: rgba(0,0,0,0.5);
      margin-left: 1px;
    }
    .badge-x:hover { color: rgba(0,0,0,0.9); }

    /* Line row */
    .line-row {
      display: flex;
      align-items: stretch;
    }

    .line-num {
      width: 44px;
      text-align: right;
      padding: 3px 10px 3px 0;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-dim);
      user-select: none;
      flex-shrink: 0;
      line-height: 22px;
    }

    .line-content {
      flex: 1;
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 22px;
      white-space: pre-wrap;
      word-break: break-all;
      padding: 3px 0;
      outline: none;
      color: var(--text);
      caret-color: var(--accent);
    }

    /* Highlight when this line has a mark */
    .block.has-mark .line-content {
      background: rgba(137,180,250,0.04);
    }

    /* Cursor hovering over text highlights selection affordance */
    .line-content::selection {
      background: rgba(137,180,250,0.3);
    }

    /* Inline highlight spans inside line-content */
    .hl {
      border-radius: 3px;
      padding: 0 2px;
      color: #111;
    }

    /* ── Right panel: annotations list ── */
    .panel {
      width: 260px;
      min-width: 200px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .panel-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 14px 14px 8px;
    }

    .ann-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px 8px;
    }

    .ann-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px 10px;
      border-radius: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      margin-bottom: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.12s;
    }
    .ann-item:hover { border-color: var(--accent); }

    .ann-item-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ann-text {
      color: var(--text-dim);
      font-family: var(--font-mono);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ann-del {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      transition: color 0.1s;
    }
    .ann-del:hover { color: var(--red); }

    .empty-state {
      text-align: center;
      padding: 32px 12px;
      color: var(--text-dim);
      font-size: 12px;
      line-height: 1.7;
    }

    /* ── Context menu ── */
    #ctx-menu {
      position: fixed;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      padding: 6px;
      z-index: 1000;
      display: none;
      min-width: 180px;
    }
    #ctx-menu.visible { display: block; }

    .ctx-header {
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 4px 8px 6px;
    }

    .ctx-cat {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.1s;
    }
    .ctx-cat:hover { background: var(--border); }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Resize handle ── */
    .resize-handle {
      width: 4px;
      cursor: col-resize;
      background: transparent;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .resize-handle:hover { background: var(--accent); }
  </style>
</head>
<body>

<header>
  <h1>&#9670; Editor de Categorias Analíticas</h1>
  <div class="header-sep"></div>
  <button class="btn" id="btn-load-sample">Carregar exemplo</button>
  <button class="btn danger" id="btn-clear-marks">Limpar marcações</button>
  <button class="btn" id="btn-export">Exportar JSON</button>
</header>

<div class="main">

  <!-- Sidebar: categories -->
  <aside>
    <div class="sidebar-title">Categorias</div>
    <div class="cat-list" id="cat-list"></div>
    <div class="new-cat">
      <input type="text" id="new-cat-name" placeholder="Nova categoria..." maxlength="32">
      <div class="color-row" id="color-row"></div>
      <button class="btn primary" id="btn-add-cat">+ Adicionar</button>
    </div>
  </aside>

  <div class="resize-handle" id="rh-left"></div>

  <!-- Editor -->
  <div class="editor-wrap">
    <div class="toolbar">
      <span class="toolbar-label">Selecione texto e clique com botão direito para categorizar</span>
    </div>
    <div class="editor-scroll" id="editor-scroll">
      <div id="editor-container"></div>
    </div>
  </div>

  <div class="resize-handle" id="rh-right"></div>

  <!-- Right panel: annotation list -->
  <div class="panel">
    <div class="panel-title">Marcações</div>
    <div class="ann-list" id="ann-list"></div>
  </div>
</div>

<!-- Context menu -->
<div id="ctx-menu">
  <div class="ctx-header">Categorizar seleção</div>
  <div id="ctx-cats"></div>
</div>

<script>
'use strict';

// ─── Palette ───────────────────────────────────────────────────────────────
const PALETTE = [
  '#89b4fa','#a6e3a1','#f9e2af','#cba6f7',
  '#f38ba8','#94e2d5','#fab387','#f5c2e7',
  '#89dceb','#b4befe','#eba0ac','#a6adc8',
];

// ─── State ─────────────────────────────────────────────────────────────────
let categories = [
  { id: uid(), name: 'Conceito-chave', color: '#89b4fa' },
  { id: uid(), name: 'Processo',       color: '#a6e3a1' },
  { id: uid(), name: 'Problema',       color: '#f38ba8' },
  { id: uid(), name: 'Solução',        color: '#f9e2af' },
];

// annotations: { id, catId, lineIndex, startOffset, endOffset, text }
let annotations = [];

let lines = [];        // string[]
let selectedColor = PALETTE[0];
let pendingSelection = null; // { lineIndex, start, end, text }

// ─── Utilities ─────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2,10); }

function catById(id) { return categories.find(c => c.id === id); }

function luminance(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return 0.299*r + 0.587*g + 0.114*b;
}

function textColorFor(hex) {
  return luminance(hex) > 0.55 ? '#111' : '#eee';
}

// ─── Render ────────────────────────────────────────────────────────────────
function renderCatList() {
  const list = document.getElementById('cat-list');
  list.innerHTML = '';
  categories.forEach(cat => {
    const div = document.createElement('div');
    div.className = 'cat-item';
    div.dataset.id = cat.id;

    const dot = document.createElement('span');
    dot.className = 'cat-dot';
    dot.style.background = cat.color;

    const name = document.createElement('span');
    name.className = 'cat-name';
    name.textContent = cat.name;

    const count = annotations.filter(a => a.catId === cat.id).length;
    const cnt = document.createElement('span');
    cnt.className = 'cat-count';
    cnt.textContent = count;

    const del = document.createElement('button');
    del.className = 'cat-del';
    del.title = 'Remover categoria';
    del.innerHTML = '&times;';
    del.addEventListener('click', e => { e.stopPropagation(); deleteCategory(cat.id); });

    div.append(dot, name, cnt, del);
    list.appendChild(div);
  });
}

function renderColorRow() {
  const row = document.getElementById('color-row');
  row.innerHTML = '';
  PALETTE.forEach(color => {
    const s = document.createElement('div');
    s.className = 'color-swatch' + (color === selectedColor ? ' selected' : '');
    s.style.background = color;
    s.title = color;
    s.addEventListener('click', () => {
      selectedColor = color;
      renderColorRow();
    });
    row.appendChild(s);
  });
}

function renderEditor() {
  const container = document.getElementById('editor-container');
  container.innerHTML = '';

  lines.forEach((line, i) => {
    const lineAnns = annotations.filter(a => a.lineIndex === i)
      .sort((a,b) => a.startOffset - b.startOffset);

    const block = document.createElement('div');
    block.className = 'block' + (lineAnns.length ? ' has-mark' : '');
    block.dataset.line = i;

    // Badge row
    const badgeRow = document.createElement('div');
    badgeRow.className = 'badge-row';
    lineAnns.forEach(ann => {
      const cat = catById(ann.catId);
      if (!cat) return;
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.style.background = cat.color;
      badge.style.color = textColorFor(cat.color);

      const dot = document.createElement('span');
      dot.textContent = '●';
      dot.style.opacity = '0.6';
      dot.style.fontSize = '8px';

      const label = document.createElement('span');
      label.textContent = cat.name;

      const x = document.createElement('button');
      x.className = 'badge-x';
      x.innerHTML = '&times;';
      x.style.color = textColorFor(cat.color);
      x.title = 'Remover marcação';
      x.addEventListener('click', () => {
        annotations = annotations.filter(a => a.id !== ann.id);
        render();
      });

      badge.append(dot, label, x);
      badgeRow.appendChild(badge);
    });

    // Line row
    const lineRow = document.createElement('div');
    lineRow.className = 'line-row';

    const lineNum = document.createElement('span');
    lineNum.className = 'line-num';
    lineNum.textContent = i + 1;

    const content = document.createElement('div');
    content.className = 'line-content';
    content.contentEditable = 'true';
    content.spellcheck = false;
    content.dataset.line = i;

    // Build content with inline highlights
    if (lineAnns.length) {
      content.innerHTML = buildHighlightedHTML(line, lineAnns);
    } else {
      content.textContent = line;
    }

    // Sync line edits back to state
    content.addEventListener('input', () => {
      lines[i] = content.innerText.replace(/\n/g, '');
      // Remove annotations for this line (text changed)
      annotations = annotations.filter(a => a.lineIndex !== i);
      // Lightweight re-render of just sidebar & panel counts
      renderCatList();
      renderAnnList();
      // Update block class
      block.className = 'block';
    });

    // Handle Enter → split line
    content.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const sel = window.getSelection();
        const range = sel.getRangeAt(0);
        const pre = getTextOffset(content, range.startContainer, range.startOffset);
        const textBefore = lines[i].slice(0, pre);
        const textAfter  = lines[i].slice(pre);
        lines.splice(i, 1, textBefore, textAfter);
        // shift annotation line indices
        annotations.forEach(a => { if (a.lineIndex > i) a.lineIndex++; });
        renderEditor();
        renderAnnList();
        // Focus next line
        const nextContent = document.querySelector(`.line-content[data-line="${i+1}"]`);
        if (nextContent) { nextContent.focus(); placeCaretAt(nextContent, 0); }
      }
      if (e.key === 'Backspace') {
        const sel = window.getSelection();
        const offset = getTextOffset(content, sel.focusNode, sel.focusOffset);
        if (offset === 0 && i > 0) {
          e.preventDefault();
          const prevLen = lines[i-1].length;
          lines[i-1] += lines[i];
          lines.splice(i, 1);
          annotations = annotations.filter(a => a.lineIndex !== i);
          annotations.forEach(a => { if (a.lineIndex > i) a.lineIndex--; });
          renderEditor();
          renderAnnList();
          const prevContent = document.querySelector(`.line-content[data-line="${i-1}"]`);
          if (prevContent) { prevContent.focus(); placeCaretAt(prevContent, prevLen); }
        }
      }
    });

    // Contextmenu → annotation
    content.addEventListener('contextmenu', e => {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) return;
      const selText = sel.toString();
      if (!selText.trim()) return;

      e.preventDefault();

      // Compute offsets within plain text of this line
      const range = sel.getRangeAt(0);
      const startOff = getTextOffset(content, range.startContainer, range.startOffset);
      const endOff   = getTextOffset(content, range.endContainer,   range.endOffset);

      pendingSelection = { lineIndex: i, start: Math.min(startOff, endOff), end: Math.max(startOff, endOff), text: selText };
      showContextMenu(e.clientX, e.clientY);
    });

    lineRow.append(lineNum, content);
    block.append(badgeRow, lineRow);
    container.appendChild(block);
  });
}

function buildHighlightedHTML(line, anns) {
  let html = '';
  let cursor = 0;
  anns.forEach(ann => {
    const cat = catById(ann.catId);
    if (!cat) return;
    if (ann.startOffset > cursor) {
      html += escHtml(line.slice(cursor, ann.startOffset));
    }
    const tc = textColorFor(cat.color);
    html += `<span class="hl" style="background:${cat.color};color:${tc}" data-ann="${ann.id}">${escHtml(line.slice(ann.startOffset, ann.endOffset))}</span>`;
    cursor = ann.endOffset;
  });
  if (cursor < line.length) html += escHtml(line.slice(cursor));
  return html;
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAnnList() {
  const list = document.getElementById('ann-list');
  if (!annotations.length) {
    list.innerHTML = '<div class="empty-state">Nenhuma marcação ainda.<br>Selecione texto no editor e clique com o botão direito.</div>';
    return;
  }
  list.innerHTML = '';
  const sorted = [...annotations].sort((a,b) => a.lineIndex - b.lineIndex || a.startOffset - b.startOffset);
  sorted.forEach(ann => {
    const cat = catById(ann.catId);
    if (!cat) return;

    const item = document.createElement('div');
    item.className = 'ann-item';

    const top = document.createElement('div');
    top.className = 'ann-item-top';

    const dot = document.createElement('span');
    dot.className = 'cat-dot';
    dot.style.background = cat.color;

    const catName = document.createElement('span');
    catName.style.fontWeight = '600';
    catName.style.fontSize = '12px';
    catName.textContent = cat.name;

    const lineRef = document.createElement('span');
    lineRef.style.cssText = 'font-size:10px;color:var(--text-dim);margin-left:auto;';
    lineRef.textContent = `L${ann.lineIndex+1}`;

    const del = document.createElement('button');
    del.className = 'ann-del';
    del.innerHTML = '&times;';
    del.title = 'Remover';
    del.addEventListener('click', e => {
      e.stopPropagation();
      annotations = annotations.filter(a => a.id !== ann.id);
      render();
    });

    top.append(dot, catName, lineRef, del);

    const text = document.createElement('div');
    text.className = 'ann-text';
    text.textContent = `"${ann.text}"`;

    item.append(top, text);

    // Click → scroll to line
    item.addEventListener('click', () => {
      const el = document.querySelector(`.line-content[data-line="${ann.lineIndex}"]`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });

    list.appendChild(item);
  });
}

function render() {
  renderEditor();
  renderCatList();
  renderAnnList();
}

// ─── Context Menu ──────────────────────────────────────────────────────────
function showContextMenu(x, y) {
  const menu = document.getElementById('ctx-menu');
  const catsDiv = document.getElementById('ctx-cats');
  catsDiv.innerHTML = '';

  if (!categories.length) {
    catsDiv.innerHTML = '<div style="padding:8px;font-size:12px;color:var(--text-dim)">Crie uma categoria primeiro.</div>';
  }

  categories.forEach(cat => {
    const item = document.createElement('div');
    item.className = 'ctx-cat';
    const dot = document.createElement('span');
    dot.className = 'cat-dot';
    dot.style.background = cat.color;
    const name = document.createElement('span');
    name.textContent = cat.name;
    item.append(dot, name);
    item.addEventListener('mousedown', e => {
      e.preventDefault();
      applyAnnotation(cat.id);
      hideContextMenu();
    });
    catsDiv.appendChild(item);
  });

  // Position
  const vw = window.innerWidth, vh = window.innerHeight;
  menu.style.left = (x + 180 > vw ? x - 186 : x) + 'px';
  menu.style.top  = (y + menu.offsetHeight + 40 > vh ? y - (catsDiv.children.length * 36 + 60) : y) + 'px';
  menu.classList.add('visible');
}

function hideContextMenu() {
  document.getElementById('ctx-menu').classList.remove('visible');
  pendingSelection = null;
}

document.addEventListener('mousedown', e => {
  if (!document.getElementById('ctx-menu').contains(e.target)) {
    hideContextMenu();
  }
});

// ─── Apply Annotation ──────────────────────────────────────────────────────
function applyAnnotation(catId) {
  if (!pendingSelection) return;
  const { lineIndex, start, end, text } = pendingSelection;

  // Remove overlapping annotations on same line for simplicity
  annotations = annotations.filter(a =>
    a.lineIndex !== lineIndex ||
    a.endOffset <= start ||
    a.startOffset >= end
  );

  annotations.push({ id: uid(), catId, lineIndex, startOffset: start, endOffset: end, text: text.trim() });
  render();
}

// ─── Category CRUD ─────────────────────────────────────────────────────────
document.getElementById('btn-add-cat').addEventListener('click', () => {
  const inp = document.getElementById('new-cat-name');
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  categories.push({ id: uid(), name, color: selectedColor });
  inp.value = '';
  // Rotate to next unused color
  const used = categories.map(c => c.color);
  const next = PALETTE.find(p => !used.includes(p)) || PALETTE[categories.length % PALETTE.length];
  selectedColor = next;
  renderColorRow();
  renderCatList();
});

document.getElementById('new-cat-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-add-cat').click();
});

function deleteCategory(id) {
  categories = categories.filter(c => c.id !== id);
  annotations = annotations.filter(a => a.catId !== id);
  render();
}

// ─── Text offset helpers ───────────────────────────────────────────────────
function getTextOffset(root, node, offset) {
  let total = 0;
  const iter = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let current;
  while ((current = iter.nextNode())) {
    if (current === node) { total += offset; break; }
    total += current.length;
  }
  return total;
}

function placeCaretAt(el, offset) {
  const iter = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  let current, remaining = offset;
  while ((current = iter.nextNode())) {
    if (remaining <= current.length) {
      const range = document.createRange();
      range.setStart(current, remaining);
      range.collapse(true);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }
    remaining -= current.length;
  }
}

// ─── Toolbar buttons ────────────────────────────────────────────────────────
document.getElementById('btn-clear-marks').addEventListener('click', () => {
  if (!annotations.length) return;
  if (confirm('Remover todas as marcações?')) {
    annotations = [];
    render();
  }
});

document.getElementById('btn-export').addEventListener('click', () => {
  const data = {
    lines,
    categories,
    annotations: annotations.map(a => ({
      ...a,
      categoryName: catById(a.catId)?.name,
      lineText: lines[a.lineIndex],
    }))
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'annotations.json'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-load-sample').addEventListener('click', () => {
  lines = SAMPLE.split('\n');
  annotations = [];
  render();
});

// ─── Sample code ────────────────────────────────────────────────────────────
const SAMPLE = `function quickSort(arr) {
  if (arr.length <= 1) return arr;

  const pivot = arr[Math.floor(arr.length / 2)];
  const left  = arr.filter(x => x < pivot);
  const mid   = arr.filter(x => x === pivot);
  const right = arr.filter(x => x > pivot);

  return [...quickSort(left), ...mid, ...quickSort(right)];
}

// Divide-and-conquer: split around a pivot
// Best/avg complexity: O(n log n)
// Worst case: O(n²) when pivot is min or max

class BinaryTree {
  constructor(value) {
    this.value = value;
    this.left  = null;
    this.right = null;
  }

  insert(val) {
    if (val < this.value) {
      if (this.left)  this.left.insert(val);
      else this.left = new BinaryTree(val);
    } else {
      if (this.right) this.right.insert(val);
      else this.right = new BinaryTree(val);
    }
  }
}`;

// ─── Init ──────────────────────────────────────────────────────────────────
lines = SAMPLE.split('\n');
renderColorRow();
render();
</script>
